apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    def androidConfigurationVersion = rootProject.ext.androidVersions

    compileSdkVersion androidConfigurationVersion.androidCompileSdkVersion
    buildToolsVersion androidConfigurationVersion.androidBuildToolsVersion

    defaultConfig {
        minSdkVersion androidConfigurationVersion.androidMinSdkVersion
        targetSdkVersion androidConfigurationVersion.androidTargetSdkVersion


        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    }
}

kapt {
    correctErrorTypes = true
}

dependencies {
    implementation project(':core-adapter')
    implementation project(':core-adapter-ktx')
    implementation project(':core-collections')
    implementation project(':core-common')
    implementation project(':core-date')
    implementation project(':core-font')
    implementation project(':core-hardware')
    implementation project(':core-intents')
    implementation project(':core-interactor')
    implementation project(':core-preferences')
    implementation project(':core-resources')
    implementation project(':core-rx')
    implementation project(':core-rx-contacts')
    implementation project(':core-rx-location')
    implementation project(':core-security')
    implementation project(':core-ui')
}

