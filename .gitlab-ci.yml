image: jangrewe/gitlab-ci-android

cache:
  key: ${CI_PROJECT_ID}
  paths:
  - .gradle/

before_script:
- export CI=GitLab
- export GRADLE_USER_HOME=$(pwd)/.gradle
- chmod +x ./gradlew

stages:
- build
- test
#- deploy

debug-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG  =~ /-debug$/'
  tags:
    - android,docker
  artifacts:
    when: on_success
    expire_in: 1 week
    reports:
      dotenv: build.env
    paths:
      - $CI_COMMIT_TAG.apk
  script:
    - ./gradlew assembleDebug
    - echo JOB_ID="$CI_JOB_ID" >> build.env
    - mv app/build/outputs/apk/debug/app-universal-debug.apk $CI_COMMIT_TAG.apk

debug-test:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG  =~ /-debug$/'
  variables:
    JOB_ID: $JOB_ID
    PLATFORM: $PLATFORM
  needs: [debug-build]
  trigger:
    project: qa/ELTA-automation
    branch: master

