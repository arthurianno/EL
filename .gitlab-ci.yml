image: jangrewe/gitlab-ci-android

cache:
  key: ${CI_PROJECT_ID}
  paths:
  - .gradle/

before_script:
- export CI=GitLab
- export GRADLE_USER_HOME=$(pwd)/.gradle
- chmod +x ./gradlew

stages:
- build
- deploy

debug-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG  =~ /-debug$/'
  tags:
    - android,docker
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - build_apks/
  script:
    - ./gradlew assembleDebug
    - mkdir build_apks
    - mv app/build/outputs/apk/debug/app-universal-debug.apk build_apks/

deploy-debug:
  image: node:latest
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG  =~ /-debug$/'
  needs: [debug-build]
  script:
    - npm install -g firebase-tools
    - TAG_MESSAGE=$(git tag -l --format='%(contents)' $CI_COMMIT_TAG)
    - firebase appdistribution:distribute build_apks/app-universal-debug.apk --app $FIREBASE_APP_ID
      --release-notes "$TAG_MESSAGE"
      --groups "testGroup"

release-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG  =~ /-release$/'
  tags:
    - android,docker
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - build_apks/
  script:
    - ./gradlew assembleRelease
    - mkdir build_apks
    - mv app/build/outputs/apk/release/app-universal-release.apk build_apks/

deploy-release:
  image: node:latest
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG  =~ /-release$/'
  needs: [release-build]
  script:
    - npm install -g firebase-tools
    - TAG_MESSAGE=$(git tag -l --format='%(contents)' $CI_COMMIT_TAG)
    - firebase appdistribution:distribute build_apks/app-universal-release.apk --app $FIREBASE_APP_ID
      --release-notes "$TAG_MESSAGE"
      --groups "testGroup"

