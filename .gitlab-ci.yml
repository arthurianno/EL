image: jangrewe/gitlab-ci-android

cache:
  key: ${CI_PROJECT_ID}
  paths:
  - .gradle/

before_script:
- export CI=GitLab
- export GRADLE_USER_HOME=$(pwd)/.gradle
- chmod +x ./gradlew

stages:
- check
- beta
- uat
- rc

complexCheck:
  stage: check
  script:
  # - ./gradlew detektCheck ktlint testDebugUnitTest -x lint
  - ./gradlew testDebugUnitTest -x lint
  only:
  - merge_requests
  - /^v(\d+)\.(\d+)\.(\d+)\-beta$/
  - /^v(\d+)\.(\d+)\.(\d+)\-rc$/
  - /^v(\d+)\.(\d+)\.(\d+)\-uat$/
  variables:
    COM_ELTA_ANDROID_CONFIG_FILE: "../configuration-build-test.properties"
  
# For tag v0.0.0-beta
beta:
  stage: beta
  only:
    - /^v(\d+)\.(\d+)\.(\d+)\-beta$/
  when: on_success
  script:
    - ./gradlew clean build crashlyticsUploadDistributionDebug -x lint
  variables:
    COM_ELTA_ANDROID_CONFIG_FILE: "../configuration-build-test.properties"

# For tag v0.0.0-uat
uat:
  stage: uat
  only:
    - /^v(\d+)\.(\d+)\.(\d+)\-uat$/
  when: on_success
  script:
    - ./gradlew clean build crashlyticsUploadDistributionDebug -x lint
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-universal-debug.apk
  variables:
    COM_ELTA_ANDROID_CONFIG_FILE: "../configuration-build-stage.properties"

# For tag v0.0.0-rc
rc:
  stage: rc
  only:
  - /^v(\d+)\.(\d+)\.(\d+)\-rc$/
  when: on_success
  script:
  - ./gradlew clean build crashlyticsUploadDistributionRelease -x lint
  artifacts:
    expire_in: 1 week
    paths:
    - app/build/outputs/
