release-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG  =~ /-release$/'
  tags:
    - android,docker
  artifacts:
    when: on_success
    expire_in: 1 week
    reports:
      dotenv: build.env
    paths:
      - $CI_COMMIT_TAG.apk
  script:
    - ./gradlew assembleRelease
    - echo JOB_ID="$CI_JOB_ID" >> build.env
    - mv app/build/outputs/apk/release/app-universal-release.apk $CI_COMMIT_TAG.apk

release-test:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG  =~ /-release$/'
  variables:
    JOB_ID: $JOB_ID
    PLATFORM: $PLATFORM
  needs: [release-build]
  trigger:
    project: qa/ELTA-automation
    branch: master

